name: Test macOS Package

on:
  workflow_dispatch:

jobs:
  build-test-macos:
    name: Build Test macOS Package
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app bundles
        run: npm run build

      - name: Build unsigned test package
        run: npx electron-builder --mac zip dmg --publish never

      - name: Verify packaged renderer assets
        run: |
          APP_PATH="$(find dist -maxdepth 2 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          npx asar list "$APP_PATH/Contents/Resources/app.asar" | grep '^/dist/renderer/index.html$'
          npx asar list "$APP_PATH/Contents/Resources/app.asar" | grep '^/dist/renderer/bundle.js$'

      - name: Upload test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: toolbox-test-macos-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error
